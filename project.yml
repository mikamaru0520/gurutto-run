name: GuruttoRun
options:
  bundleIdPrefix: com.marotech
  deploymentTarget:
    iOS: "18.0"
  defaultConfig: Debug
  developmentLanguage: ja
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete

fileGroups:
  - project.yml
  - Config

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

targets:
  GuruttoRun:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - GuruttoRun
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marotech.GuruttoRun
        INFOPLIST_FILE: GuruttoRun/Info.plist
        PRODUCT_NAME: "ぐるっとらん"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: ComposableArchitecture
    entitlements:
      path: GuruttoRun/GuruttoRun.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true

  GuruttoRunTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GuruttoRunTests
    dependencies:
      - target: GuruttoRun
      - package: ComposableArchitecture
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.marotech.GuruttoRunTests

packages:
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: "1.15.0"

schemes:
  GuruttoRun:
    build:
      targets:
        GuruttoRun: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: GuruttoRunTests
